  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    html, body { margin: 0; padding: 0; background: #faf7f1; }\n    * { box-sizing: border-box; }\n    a { color: #16243a; }\n    a:hover { color: #34527a; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#faf7f1;color:#16243a;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;min-height:100vh;padding:0 clamp(16px,4vw,56px);-webkit-font-smoothing:antialiased\">\n\n  <header data-screen-label=\"Header\" style=\"max-width:1200px;margin:0 auto;padding:clamp(20px,3vh,32px) 0 clamp(28px,4vh,44px);display:flex;flex-direction:column;gap:0\">\n    <div style=\"display:flex;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid #16243a\">\n      <img src=\"f4a5c1aa-b0fb-410c-8fe4-6f97b30ebc63\" alt=\"Stone Center for Inequality Dynamics, University of Michigan\" style=\"display:block;height:auto;width:min(100%,440px);max-width:100%\">\n      <div style=\"font:500 12px/1.4 'Oswald',Impact,sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:#4f5968\">Research explainer · Draft for review<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px clamp(32px,5vw,80px);align-items:end;padding-top:clamp(28px,6vh,64px)\">\n      <h1 style=\"font:400 clamp(46px,7.2vw,104px)/1.02 'Oswald',Impact,sans-serif;letter-spacing:-0.01em;margin:0;text-wrap:balance\">One region. Different tax bases.<\u002Fh1>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:520px;padding-bottom:6px\">\n        <p style=\"font:400 clamp(19px,1.9vw,23px)/1.4 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">Cities, towns, and villages across the Albany metropolitan area have very different amounts of taxable property per resident. The regional average obscures those differences.<\u002Fp>\n        <p style=\"font:400 14px/1.5 'Atkinson Hyperlegible',Verdana,sans-serif;color:#4f5968;margin:0;text-wrap:pretty\">Based on research by Robert Manduca, Brian Highsmith, and Jacob Waggoner. Property records from 2019; population from the 2020 Census.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div id=\"om-scrolly\" style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px clamp(32px,5vw,72px);align-items:flex-start;border-top:1px solid #d9d3c7;padding-top:8px\">\n\n    <div style=\"flex:1 1 300px;max-width:470px;min-width:0\">\n\n      <section data-step=\"1\" data-screen-label=\"Chapter 1 — The region\" style=\"min-height:72vh;padding:8vh 0 14vh;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n                <h2 style=\"font:500 clamp(30px,3vw,38px)/1.1 'Oswald',Impact,sans-serif;margin:0;text-wrap:balance\">The region as a whole<\u002Fh2>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The Albany–Schenectady–Troy metropolitan area includes Albany, Rensselaer, Saratoga, Schenectady, and Schoharie counties.<\u002Fp>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:6px 0\"><dc-import name=\"FragMap\" model=\"{{ model }}\" chapter=\"1\" focus-id=\"{{ focusId }}\" labels=\"{{ labels1 }}\" caption=\"{{ caption1 }}\" reduce-motion=\"{{ reduceMotion }}\" hint-size=\"100%,440px\"><\u002Fdc-import><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The study records about {{ metroTotal }} in taxable property value across the region in 2019. Using the 2020 population, that works out to about {{ metroVpr }} per resident.<\u002Fp>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">But that average tells us little about the property tax base within each city, town, or village.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-step=\"2\" data-screen-label=\"Chapter 2 — Boundaries\" style=\"min-height:72vh;padding:8vh 0 14vh;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n                <h2 style=\"font:500 clamp(30px,3vw,38px)/1.1 'Oswald',Impact,sans-serif;margin:0;text-wrap:balance\">Each local government has its own property tax base<\u002Fh2>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">A local government's property tax base is the value of property subject to its property taxes. Its size depends on which properties fall within the government's boundaries.<\u002Fp>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:6px 0\"><dc-import name=\"FragMap\" model=\"{{ model }}\" chapter=\"2\" boundaries=\"{{ boundariesOn }}\" focus-id=\"{{ focusId }}\" labels=\"{{ labels2 }}\" caption=\"{{ caption2 }}\" on-select=\"{{ selectPlace }}\" selected-id=\"{{ selectedId }}\" reduce-motion=\"{{ reduceMotion }}\" hint-size=\"100%,440px\"><\u002Fdc-import><\u002Fdiv>\n        <\u002Fsc-if>\n        \n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The study compares {{ featureCount }} local governments: {{ cityCountWord }} cities, {{ townCount }} towns, and {{ villageCount }} villages. For this comparison, researchers assign each property to the smallest general-purpose local government that can tax it. Property within a village therefore counts toward the village's total rather than the surrounding town's.<\u002Fp>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">Counties, school districts, and special districts also tax property, but they are not shown here.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-step=\"3\" data-screen-label=\"Chapter 3 — Tax base\" style=\"min-height:72vh;padding:8vh 0 14vh;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n                <h2 style=\"font:500 clamp(30px,3vw,38px)/1.1 'Oswald',Impact,sans-serif;margin:0;text-wrap:balance\">Taxable property value per resident<\u002Fh2>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">Dividing taxable property value by the number of residents lets us compare places of different sizes. The map shows each local government's figure relative to the regional average of {{ metroVpr }}.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:baseline;padding:14px 16px;border-left:3px solid #16243a;background:#f1ede4\">\n          <div style=\"font:600 22px/1.1 'Oswald',Impact,sans-serif;text-align:right\">1×<\u002Fdiv><div style=\"font:400 17px/1.4 'Atkinson Hyperlegible',Verdana,sans-serif\">means the regional average.<\u002Fdiv>\n          <div style=\"font:600 22px/1.1 'Oswald',Impact,sans-serif;text-align:right\">0.5×<\u002Fdiv><div style=\"font:400 17px/1.4 'Atkinson Hyperlegible',Verdana,sans-serif\">means half the average.<\u002Fdiv>\n          <div style=\"font:600 22px/1.1 'Oswald',Impact,sans-serif;text-align:right\">2×<\u002Fdiv><div style=\"font:400 17px/1.4 'Atkinson Hyperlegible',Verdana,sans-serif\">means twice the average.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:6px 0\"><dc-import name=\"FragMap\" model=\"{{ model }}\" chapter=\"3\" boundaries=\"{{ boundariesOn }}\" focus-id=\"{{ focusId }}\" labels=\"{{ labels3 }}\" caption=\"{{ caption3 }}\" on-select=\"{{ selectPlace }}\" selected-id=\"{{ selectedId }}\" reduce-motion=\"{{ reduceMotion }}\" hint-size=\"100%,520px\"><\u002Fdc-import><\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The shading describes taxable property inside each boundary. It is not residents' personal wealth, the government's revenue, or its budget.<\u002Fp>\n      <\u002Fsection>\n\n      <section data-step=\"4\" data-screen-label=\"Chapter 4 — Albany\" style=\"min-height:72vh;padding:8vh 0 16vh;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n                <h2 style=\"font:500 clamp(30px,3vw,38px)/1.1 'Oswald',Impact,sans-serif;margin:0;text-wrap:balance\">Albany is near the regional average. Its neighbors are not.<\u002Fh2>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The City of Albany has about {{ focusVpr }} in taxable property value per resident, {{ focusRel }}.<\u002Fp>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:6px 0\"><dc-import name=\"FragMap\" model=\"{{ model }}\" chapter=\"4\" boundaries=\"{{ boundariesOn }}\" zoomed=\"{{ zoomed }}\" focus-id=\"{{ focusId }}\" compare-ids=\"{{ compareIds }}\" labels=\"{{ labels4 }}\" caption=\"{{ caption4 }}\" on-select=\"{{ selectPlace }}\" selected-id=\"{{ selectedId }}\" reduce-motion=\"{{ reduceMotion }}\" hint-size=\"100%,520px\"><\u002Fdc-import><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n          <button type=\"button\" aria-pressed=\"{{ zoomed }}\" sc-camel-on-click=\"{{ toggleZoom }}\" style=\"font:500 14px/1 'Oswald',Impact,sans-serif;letter-spacing:0.04em;padding:8px 14px;border-radius:3px;border:1px solid #16243a;background:transparent;color:#16243a;cursor:pointer;white-space:nowrap\" style-hover=\"background:#f1ede4;color:#16243a\" style-focus=\"outline:2px solid #c9922a;outline-offset:2px\">{{ zoomLabel }}<\u002Fbutton>\n          <div style=\"font:400 13px/1.4 'Atkinson Hyperlegible',Verdana,sans-serif;color:#4f5968\">Solid outline: City of Albany. Dashed outlines: Colonie and Troy.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:4px\">\n          <div style=\"font:500 13px/1.3 'Oswald',Impact,sans-serif;letter-spacing:0.08em;text-transform:uppercase\">Taxable property value per resident<\u002Fdiv>\n          <div style=\"position:relative;height:20px\">\n            <div style=\"position:absolute;left:{{ benchLeft }};top:0;height:20px;border-left:2px dashed #16243a\"><\u002Fdiv>\n            <div style=\"position:absolute;right:{{ benchRight }};top:0;padding-right:6px;text-align:right;font:700 12px/1.2 'Atkinson Hyperlegible',Verdana,sans-serif;white-space:nowrap\">Regional average = 1 · {{ metroVpr }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <sc-for list=\"{{ bars }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button type=\"button\" aria-pressed=\"{{ c.selected }}\" sc-camel-on-click=\"{{ c.select }}\" style=\"display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:8px 8px 9px;border-radius:3px;border:1px solid {{ c.border }};background:{{ c.bg }};color:#16243a;cursor:pointer;font-family:inherit\" style-focus=\"outline:2px solid #c9922a;outline-offset:2px\">\n                <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\">\n                  <div style=\"font:500 17px/1.2 'Oswald',Impact,sans-serif;white-space:nowrap\">{{ c.name }}<\u002Fdiv>\n                  <div style=\"font:400 14px/1.2 'Atkinson Hyperlegible',Verdana,sans-serif;color:#2f3a4c;white-space:nowrap\">{{ c.vpr }} · {{ c.ratio }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative;height:14px;background:#ece8df\">\n                  <div style=\"position:absolute;left:0;top:0;height:14px;width:{{ c.width }};background:{{ c.color }};border:1px solid #16243a;transition:{{ barMotion }}\"><\u002Fdiv>\n                  <div style=\"position:absolute;left:{{ benchLeft }};top:-3px;height:20px;border-left:2px dashed #16243a\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font:400 13px/1.4 'Atkinson Hyperlegible',Verdana,sans-serif;color:#4f5968;text-wrap:pretty\">Bars share one scale; the dashed line is the regional average. Select a row to highlight the place on the map.<\u002Fdiv>\n          <div style=\"font:400 14px/1.5 'Atkinson Hyperlegible',Verdana,sans-serif;color:#2f3a4c;padding:10px 12px;background:#f1ede4;text-wrap:pretty\">Residential property makes up {{ focusResShare }} of Albany's taxable property value, compared with {{ c1.resShare }} in {{ c1.name }} and {{ c2.resShare }} in {{ c2.name }}. The remainder is commercial and other nonresidential property.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">Neighboring {{ c1.name }} is {{ c1.rel }}. {{ c2.name }} has {{ c2.relHas }}.<\u002Fp>\n        <p style=\"font:400 19px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The differences are larger across the full metropolitan area: taxable property value per resident ranges from {{ minTimes }} times the regional average in the {{ minName }} to {{ maxTimes }} times the average in the {{ maxName }}.<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:4px\">\n          <label for=\"om-place-select\" style=\"font:500 13px/1.3 'Oswald',Impact,sans-serif;letter-spacing:0.08em;text-transform:uppercase\">Find a city, town, or village<\u002Flabel>\n          <sc-raw-select id=\"om-place-select\" value=\"{{ selectedValue }}\" sc-camel-on-change=\"{{ onPick }}\" style=\"font:400 15px/1.3 'Atkinson Hyperlegible',Verdana,sans-serif;padding:8px 10px;border:1px solid #16243a;border-radius:3px;background:#faf7f1;color:#16243a;max-width:100%\" style-focus=\"outline:2px solid #c9922a;outline-offset:2px\">\n            <option value=\"\">Select a place to compare it with Albany and the region…<\u002Foption>\n            <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"0\">\n              <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"Sticky map\" style=\"flex:1.5 1 420px;min-width:0;position:sticky;top:0;align-self:flex-start;background:#faf7f1;z-index:2\">\n      <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:min(100%,calc(100vh - 300px));min-width:min(100%,320px);margin:0 auto;padding:12px 0 8px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px\">\n            <div style=\"font:500 13px/1.3 'Oswald',Impact,sans-serif;letter-spacing:0.1em;text-transform:uppercase;color:#34527a\">{{ chapterTitle }}<\u002Fdiv>\n            <div style=\"font:400 12px/1.3 'Atkinson Hyperlegible',Verdana,sans-serif;color:#4f5968\">{{ metroName }}<\u002Fdiv>\n          <\u002Fdiv>\n          <dc-import name=\"FragMap\" model=\"{{ model }}\" chapter=\"{{ chapter }}\" boundaries=\"{{ boundariesOn }}\" zoomed=\"{{ zoomed }}\" focus-id=\"{{ focusId }}\" compare-ids=\"{{ compareIdsForChapter }}\" labels=\"{{ labelsForChapter }}\" caption=\"{{ captionForChapter }}\" on-select=\"{{ selectPlace }}\" selected-id=\"{{ selectedId }}\" reduce-motion=\"{{ reduceMotion }}\" hint-size=\"100%,560px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section data-screen-label=\"Chapter 5 — What follows\" style=\"max-width:760px;margin:0 auto;padding:10vh 0 4vh;display:flex;flex-direction:column;gap:16px;border-top:1px solid #d9d3c7\">\n        <h2 style=\"font:500 clamp(30px,3vw,40px)/1.1 'Oswald',Impact,sans-serif;margin:0;text-wrap:balance\">What the map tells us—and what it doesn't<\u002Fh2>\n    <p style=\"font:400 20px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The map shows how taxable property value per resident varies across local governments. It does not show how much money those governments collect or spend. Tax rules, other revenue sources, transfers, and spending needs also affect local finances.<\u002Fp>\n    <p style=\"font:400 20px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;margin:0;text-wrap:pretty\">The figures use 2019 property records and 2020 population data. They do not represent current property values or current government budgets.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Explore\" style=\"max-width:760px;margin:0 auto;padding:4vh 0 8vh;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <a href=\"https://www.taxbasefragmentation.net/\" target=\"_blank\" rel=\"noopener\" style=\"font:500 15px/1 'Oswald',Impact,sans-serif;letter-spacing:0.04em;padding:14px 18px;border-radius:3px;border:1px solid #16243a;background:#16243a;color:#faf7f1;text-decoration:none;white-space:nowrap\" style-hover=\"background:#34527a;color:#faf7f1\" style-focus=\"outline:2px solid #c9922a;outline-offset:2px\">Explore the full research map ↗<\u002Fa>\n      <a href=\"https://doi.org/10.1093/ser/mwaf055\" target=\"_blank\" rel=\"noopener\" style=\"font:500 15px/1 'Oswald',Impact,sans-serif;letter-spacing:0.04em;padding:14px 18px;border-radius:3px;border:1px solid #16243a;background:transparent;color:#16243a;text-decoration:none;white-space:nowrap\" style-hover=\"background:#f1ede4;color:#16243a\" style-focus=\"outline:2px solid #c9922a;outline-offset:2px\">Read the paper ↗<\u002Fa>\n      <a href=\"https://www.taxbasefragmentation.net/data\" target=\"_blank\" rel=\"noopener\" style=\"font:500 15px/1 'Oswald',Impact,sans-serif;letter-spacing:0.04em;padding:14px 18px;border-radius:3px;border:1px solid #16243a;background:transparent;color:#16243a;text-decoration:none;white-space:nowrap\" style-hover=\"background:#f1ede4;color:#16243a\" style-focus=\"outline:2px solid #c9922a;outline-offset:2px\">Data and methods ↗<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"font:400 14px/1.5 'Atkinson Hyperlegible',Verdana,sans-serif;color:#2f3a4c;margin:6px 0 0;text-wrap:pretty\">Research: Robert Manduca, Brian Highsmith, and Jacob Waggoner, “Tax base fragmentation as a dimension of metropolitan inequality,” <em>Socio-Economic Review<\u002Fem> 24, no. 1 (2026): 331–362. Data and map geometry from taxbasefragmentation.net.<\u002Fp>\n  <\u002Fsection>\n\n  <footer data-screen-label=\"About the data\" style=\"max-width:760px;margin:0 auto;padding:0 0 12vh;display:flex;flex-direction:column;gap:12px;border-top:1px solid #d9d3c7\">\n    <details style=\"padding-top:18px\">\n      <summary style=\"font:500 16px/1.3 'Oswald',Impact,sans-serif;letter-spacing:0.04em;cursor:pointer;padding:6px 0\">About the data<\u002Fsummary>\n      <ul style=\"margin:10px 0 0;padding-left:18px;font:400 14px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;color:#2f3a4c;display:flex;flex-direction:column;gap:7px\">\n        <li>Measure: the full appraised value of taxable real property of all types in 2019, from assessor records compiled by CoreLogic, divided by residents. It is not tax revenue, a household's assets, or the assessed value used to calculate any individual tax bill.<\u002Fli>\n        <li>Population: 2020 Census counts for blocks that contain at least one property in the study's records. These can differ from official city or town totals.<\u002Fli>\n        <li>Geography: {{ featureCount }} general-purpose local governments in the Albany–Schenectady–Troy metropolitan area ({{ cityCount }} cities, {{ townCount }} towns, {{ villageCount }} villages), as mapped by the research project. Village territory is carved out of the surrounding town. The map layer does not state the year of its boundaries.<\u002Fli>\n        <li>Benchmark: the metro average of {{ metroVpr }} per resident is the project's published metro figure. It equals the population-weighted average of all {{ featureCount }} jurisdictions. Ratios are shown to two decimals and the map classes use those rounded values.<\u002Fli>\n        <li>Versions: the project's interactive map carries slightly different values from its downloadable tables for most jurisdictions here, including the City of Albany ({{ focusMapVpr }} on the map versus {{ focusVpr }} in the table). This explainer uses the downloadable tables throughout; the difference has been flagged to the researchers.<\u002Fli>\n        <li>The study also publishes a metro-wide “tax base fragmentation quotient” ({{ tfq }} for this metro). It is a separate measure and is not shown here.<\u002Fli>\n        <li>The two comparison places were chosen editorially, not by the researchers, and not for being the highest or lowest values.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdetails>\n    <details>\n      <summary style=\"font:500 16px/1.3 'Oswald',Impact,sans-serif;letter-spacing:0.04em;cursor:pointer;padding:6px 0\">All {{ featureCount }} jurisdictions as a table<\u002Fsummary>\n      <div style=\"overflow-x:auto;margin-top:10px\">\n        <sc-raw-table style=\"border-collapse:collapse;width:100%;font:400 14px/1.4 'Atkinson Hyperlegible',Verdana,sans-serif;color:#16243a\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th scope=\"col\" style=\"text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid #16243a\">Place<\u002Fsc-raw-th>\n              <sc-raw-th scope=\"col\" style=\"text-align:right;padding:8px 10px;border-bottom:1px solid #16243a;white-space:nowrap\">Appraised value per resident<\u002Fsc-raw-th>\n              <sc-raw-th scope=\"col\" style=\"text-align:right;padding:8px 10px;border-bottom:1px solid #16243a;white-space:nowrap\">Relative to metro average<\u002Fsc-raw-th>\n              <sc-raw-th scope=\"col\" style=\"text-align:right;padding:8px 10px;border-bottom:1px solid #16243a;white-space:nowrap\">Residents<\u002Fsc-raw-th>\n              <sc-raw-th scope=\"col\" style=\"text-align:right;padding:8px 10px;border-bottom:1px solid #16243a;white-space:nowrap\">Residential share<\u002Fsc-raw-th>\n              <sc-raw-th scope=\"col\" style=\"text-align:left;padding:8px 0 8px 10px;border-bottom:1px solid #16243a\">Note<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr>\n              <sc-raw-th scope=\"row\" style=\"text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid #d9d3c7;font-weight:700\">Metro average<\u002Fsc-raw-th>\n              <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums;font-weight:700\">{{ metroVpr }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums;font-weight:700\">{{ oneRatio }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums;font-weight:700\">{{ metroPop }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums;font-weight:700\">{{ metroResShare }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0 7px 10px;border-bottom:1px solid #d9d3c7;color:#4f5968\">{{ metroName }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n            <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"0\">\n              <sc-raw-tr>\n                <sc-raw-th scope=\"row\" style=\"text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid #d9d3c7;font-weight:400\">{{ r.name }}<\u002Fsc-raw-th>\n                <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums\">{{ r.vpr }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums\">{{ r.ratio }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums\">{{ r.pop }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right;padding:7px 10px;border-bottom:1px solid #d9d3c7;font-variant-numeric:tabular-nums\">{{ r.res }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 0 7px 10px;border-bottom:1px solid #d9d3c7;color:#4f5968\">{{ r.note }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdetails>\n    <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font:400 14px/1.5 'Atkinson Hyperlegible',Verdana,sans-serif;color:#9e5033\">{{ error }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;extraLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Map&quot;},&quot;ratioFormat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;multiple&quot;,&quot;options&quot;:[&quot;multiple&quot;,&quot;percent&quot;],&quot;tsType&quot;:&quot;'multiple' | 'percent'&quot;,&quot;section&quot;:&quot;Numbers&quot;}}\">\nconst CLASSES = [\n  { max: 0.5, color: '#9e5033', label: 'under 0.5×' },\n  { max: 0.75, color: '#c68a6a', label: '0.5–0.75×' },\n  { max: 0.9, color: '#e2c3ab', label: '0.75–0.9×' },\n  { max: 1.1, color: '#dcd7cc', label: '0.9–1.1×' },\n  { max: 1.5, color: '#b4c4d6', label: '1.1–1.5×' },\n  { max: 2, color: '#7391b3', label: '1.5–2×' },\n  { max: Infinity, color: '#34527a', label: '2× and up' },\n];\nconst CONFIG_PATH = './albany/story-config.json';\nconst usd = v => '$' + Math.round(v).toLocaleString('en-US');\nconst num = v => v.toLocaleString('en-US');\nconst pctShare = v => Math.round(v * 100) + '%';\nconst r2 = v => Math.round(v * 100) / 100;\nconst displayName = n => { const m = n.match(/^(.*) (city|town|village)$/); return m ? ({ city: 'City', town: 'Town', village: 'Village' })[m[2]] + ' of ' + m[1] : n; };\nconst bboxOf = coords => { const b = { minx: Infinity, miny: Infinity, maxx: -Infinity, maxy: -Infinity }; const w = c => { if (typeof c[0] === 'number') { if (c[0] < b.minx) b.minx = c[0]; if (c[0] > b.maxx) b.maxx = c[0]; if (c[1] < b.miny) b.miny = c[1]; if (c[1] > b.maxy) b.maxy = c[1]; } else c.forEach(w); }; w(coords); return b; };\n\nclass Component extends DCLogic {\n  state = { loading: true, error: null, chapter: 1, boundaries: true, fullMetro: false, selectedId: null, reduceMotion: false, narrow: false };\n  feats = []; byId = {}; cfg = null; metro = null; model = null; modelKey = '';\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(prefers-reduced-motion: reduce)');\n    this.onMq = () => this.setState({ reduceMotion: this.mq.matches });\n    this.onMq(); this.mq.addEventListener('change', this.onMq);\n    this.onScroll = () => this.updateChapter();\n    this.onResize = () => { const narrow = document.documentElement.clientWidth < 760; if (narrow !== this.state.narrow) this.setState({ narrow }); this.updateChapter(); };\n    document.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    this.onResize();\n    this.load();\n  }\n  componentWillUnmount() { this.mq.removeEventListener('change', this.onMq); document.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); }\n\n  async load() {\n    const res = window.__resources || {};\n    const get = async (p, id) => { const r = await fetch(res[id] || p); if (!r.ok) throw new Error('Could not load ' + p); return r.json(); };\n    try {\n      const cfg = await get(CONFIG_PATH, 'storyConfig');\n      const [mgj, gj, data] = await Promise.all([get(cfg.metro_file, 'metroBoundary'), get(cfg.jurisdictions_file, 'jurisdictions'), get(cfg.data_file, 'storyData')]);\n      this.cfg = cfg; this.build(mgj, gj, data);\n      this.setState({ loading: false }, () => this.updateChapter());\n      setTimeout(() => this.updateChapter(), 0);\n    } catch (e) { this.setState({ loading: false, error: e.message || String(e) }); }\n  }\n\n  build(mgj, gj, data) {\n    const mg = mgj.features[0].geometry, bb = bboxOf(mg.coordinates);\n    const latC = (bb.miny + bb.maxy) / 2, lonC = (bb.minx + bb.maxx) / 2, cosL = Math.cos(latC * Math.PI / 180);\n    const k = Math.min(960 / ((bb.maxx - bb.minx) * cosL), 960 / (bb.maxy - bb.miny));\n    const px = lon => 500 + (lon - lonC) * cosL * k, py = lat => 500 - (lat - latC) * k;\n    const ringD = r => { let out = '', lx = null, ly = null; r.forEach((c, i) => { const x = px(c[0]).toFixed(1), y = py(c[1]).toFixed(1); if (x === lx && y === ly) return; out += (i ? 'L' : 'M') + x + ' ' + y; lx = x; ly = y; }); return out + 'Z'; };\n    const polys = g => g.type === 'Polygon' ? [g.coordinates] : g.coordinates;\n    // Interior rings stay separate subpaths painted with fill-rule: evenodd, so holes render as holes whatever the ring winding.\n    const geomD = g => polys(g).map(p => p.map(ringD).join('')).join('');\n    this.metro = data.metro || mgj.features[0].properties;\n    this.metroD = geomD(mg);\n    this.feats = gj.features.map(f => { const p = f.properties, b = bboxOf(f.geometry.coordinates);\n      const noData = p.data_status === 'no_data', review = p.data_quality === 'source_inconsistency', ok = !noData && !review && typeof p.fcr === 'number';\n      return { id: String(p.id), name: displayName(p.display_name || p.name), raw: p, d: geomD(f.geometry), ok, noData, review, cls: ok ? CLASSES.findIndex(c => r2(p.fcr) < c.max) : -1,\n        cx: px((b.minx + b.maxx) / 2), cy: py((b.miny + b.maxy) / 2), x1: px(b.minx), y1: py(b.maxy), x2: px(b.maxx), y2: py(b.miny) }; });\n    this.byId = Object.fromEntries(this.feats.map(f => [f.id, f]));\n    const zf = (this.cfg.close_view_ids || []).map(id => this.byId[id]).filter(Boolean);\n    if (zf.length) { const x1 = Math.min(...zf.map(f => f.x1)), y1 = Math.min(...zf.map(f => f.y1)), x2 = Math.max(...zf.map(f => f.x2)), y2 = Math.max(...zf.map(f => f.y2));\n      const s = Math.min(1000 / ((x2 - x1) * 1.15), 1000 / ((y2 - y1) * 1.15)); this.zoom = { s, tx: 500 - (x1 + x2) / 2 * s, ty: 500 - (y1 + y2) / 2 * s }; } else this.zoom = { s: 1, tx: 0, ty: 0 };\n    this.sorted = [...this.feats].sort((a, b) => a.raw.name.localeCompare(b.raw.name));\n    this.counts = data.counts || {};\n  }\n\n  ratio(v) { return this.props.ratioFormat === 'percent' ? Math.round(v * 100) + '%' : r2(v).toFixed(2) + '×'; }\n  rel(v) { const d = Math.round((v - 1) * 100); if (Math.abs(v - 0.5) <= 0.03) return 'about half the regional average'; if (Math.abs(v - 2) <= 0.06) return 'about twice the regional average'; if (Math.abs(d) < 1) return 'about the regional average'; return 'roughly ' + Math.abs(d) + '% ' + (d > 0 ? 'above' : 'below') + ' the regional average'; }\n  relHas(v) { const s = this.rel(v); return /^about (half|twice)/.test(s) ? s : s.replace(/^roughly /, 'a value roughly ').replace(/^about the/, 'a value near the'); }\n  ratioPhrase(v) { return this.props.ratioFormat === 'percent' ? Math.round(v * 100) + '% of the metro average' : r2(v).toFixed(2) + '× the metro average'; }\n  ensureModel() {\n    const key = String(this.props.ratioFormat); if (this.model && this.modelKey === key) return this.model;\n    this.modelKey = key;\n    const features = this.feats.map(f => ({ id: f.id, name: f.name, d: f.d, cx: f.cx, cy: f.cy, ok: f.ok, color: f.ok ? CLASSES[f.cls].color : null, lines: this.lines(f) }));\n    this.model = { metroD: this.metroD, metroName: this.metro.name, features, byId: Object.fromEntries(features.map(f => [f.id, f])), zoom: this.zoom, classes: CLASSES.map(c => ({ color: c.color, label: c.label, max: c.max })), hasNoData: this.feats.some(f => f.noData || f.review) };\n    return this.model;\n  }\n  lines(f) { const p = f.raw;\n    if (f.noData) return ['No matched research data. This does not mean the place has no residents or property.'];\n    if (f.review) return ['Source values require review; left out of comparisons.'];\n    return [usd(p.appraised_property_value_per_resident) + ' in taxable property value per resident', this.rel(p.fcr) + ' (' + this.ratio(p.fcr) + ')', num(p.population) + ' residents (2020 Census, study-covered blocks)', pctShare(p.pct_residential) + ' of taxable property value is residential']; }\n\n  updateChapter() {\n    const steps = document.querySelectorAll('[data-step]'); if (!steps.length || this.state.narrow) return;\n    const line = window.innerHeight * 0.45; let ch = 1;\n    steps.forEach(el => { if (el.getBoundingClientRect().top <= line) ch = Number(el.dataset.step); });\n    if (ch !== this.state.chapter) this.setState({ chapter: ch });\n  }\n  select(id) { this.setState(s => ({ selectedId: id && s.selectedId !== id ? id : null })); }\n\n  renderVals() {\n    const st = this.state, P = this.props, loaded = this.feats.length > 0, cfg = this.cfg || {};\n    const model = loaded ? this.ensureModel() : null, m = this.metro || {};\n    const ch = st.chapter, zoomed = !st.fullMetro;\n    const focusId = cfg.focus ? cfg.focus.id : null, focus = focusId ? this.byId[focusId] : null;\n    const cmps = (cfg.comparisons || []).map(c => Object.assign({}, c, { f: this.byId[c.id] })).filter(c => c.f && c.f.ok);\n    const compareIds = cmps.map(c => c.id);\n    const L = cfg.labels || {};\n    const labels1 = (L.always || []), labels3 = labels1.concat(L.from_chapter_3 || []), labelsX = P.extraLabels ? (L.extra || []) : [];\n    const labelsFor = n => (n >= 3 ? labels3 : labels1).concat(labelsX).concat(n === 4 && zoomed ? (L.close_view || []) : []);\n    const captions = { 1: 'Outline: the ' + (m.name || 'metropolitan area') + ' metropolitan area. Shaded: the City of Albany.', 2: 'Lines: the ' + this.feats.length + ' general-purpose local governments in the study. Select a place for its figures.', 3: 'Select a place for its figures.', 4: 'Select a place to compare it with Albany and the region.' };\n    const ok = this.feats.filter(f => f.ok);\n    const minF = ok.length ? ok.reduce((a, b) => a.raw.fcr < b.raw.fcr ? a : b) : null, maxF = ok.length ? ok.reduce((a, b) => a.raw.fcr > b.raw.fcr ? a : b) : null;\n    const barFeats = [focus, ...cmps.map(c => c.f)].filter(f => f && f.ok);\n    const scaleMax = Math.max(1.5, Math.ceil(Math.max(0, ...barFeats.map(f => f.raw.fcr)) * 2) / 2);\n    const bars = barFeats.map(f => { const sel = st.selectedId === f.id; return { id: f.id, name: f.name, vpr: usd(f.raw.appraised_property_value_per_resident), ratio: this.ratio(f.raw.fcr), width: (f.raw.fcr / scaleMax * 100).toFixed(2) + '%', color: CLASSES[f.cls].color, selected: sel, bg: sel ? '#f1ede4' : 'transparent', border: sel ? '#c9922a' : '#d9d3c7', select: () => this.select(f.id) }; });\n    const cmpVals = cmps.map(c => ({ name: c.short_name || c.f.name, descriptor: c.descriptor || '', ratioPhrase: this.ratioPhrase(c.f.raw.fcr), rel: this.rel(c.f.raw.fcr), relHas: this.relHas(c.f.raw.fcr), ratio: this.ratio(c.f.raw.fcr), vpr: usd(c.f.raw.appraised_property_value_per_resident), resShare: pctShare(c.f.raw.pct_residential) }));\n    const empty = { name: '', descriptor: '', ratioPhrase: '', rel: '', relHas: '', ratio: '', vpr: '', resShare: '' };\n    const titles = { 1: 'The region', 2: 'Local government boundaries', 3: 'Taxable property value per resident', 4: 'Albany, Colonie, and Troy' };\n    const c = (this.counts && this.counts.kinds) || {};\n    return {\n      hasError: !!st.error, error: st.error || '', narrow: st.narrow, wide: !st.narrow, reduceMotion: st.reduceMotion,\n      model, chapter: ch, chapterTitle: titles[ch], metroName: m.name || '',\n      focusId, compareIds, compareIdsForChapter: ch >= 4 ? compareIds : [], labels1, labels2: labels1.concat(labelsX), labels3: labels3.concat(labelsX), labels4: labelsFor(4), labelsForChapter: labelsFor(ch),\n      caption1: captions[1], caption2: captions[2], caption3: captions[3], caption4: captions[4], captionForChapter: captions[ch],\n      selectedId: st.selectedId, selectPlace: id => this.select(id), selectedValue: st.selectedId || '', onPick: e => this.setState({ selectedId: e.target.value || null }),\n      boundariesOn: st.boundaries, boundaryLabel: st.boundaries ? 'Hide boundaries' : 'Show boundaries', toggleBoundaries: () => this.setState(s => ({ boundaries: !s.boundaries })),\n      zoomed: ch >= 4 || st.narrow ? zoomed : false, zoomLabel: zoomed ? 'Show the full metro' : 'Return to the closer view', toggleZoom: () => this.setState(s => ({ fullMetro: !s.fullMetro })),\n      barMotion: st.reduceMotion ? 'none' : 'width 500ms ease',\n      metroVpr: m.appraised_property_value_per_resident ? usd(m.appraised_property_value_per_resident) : '', metroPop: m.study_covered_population ? num(m.study_covered_population) : '',\n      metroTotal: m.appraised_property_value_total ? '$' + (m.appraised_property_value_total / 1e9).toFixed(1) + ' billion' : '', metroResShare: m.appraised_property_value_per_resident ? pctShare(m.appraised_property_value_per_resident_residential / m.appraised_property_value_per_resident) : '',\n      tfq: typeof m.tfq_all_properties === 'number' ? m.tfq_all_properties.toFixed(2) : '', oneRatio: this.ratio(1),\n      featureCount: loaded ? String(this.feats.length) : '100', cityCount: c.city || '', cityCountWord: c.city ? (['zero','one','two','three','four','five','six','seven','eight','nine'][c.city] || String(c.city)) : '', townCount: c.town || '', villageCount: c.village || '',\n      focusVpr: focus ? usd(focus.raw.appraised_property_value_per_resident) : '', focusRatioPhrase: focus ? this.ratioPhrase(focus.raw.fcr) : '', focusRel: focus ? this.rel(focus.raw.fcr) : '', focusResShare: focus ? pctShare(focus.raw.pct_residential) : '', focusMapVpr: focus && focus.raw.map_layer_value_per_resident ? usd(focus.raw.map_layer_value_per_resident) : '',\n      c1: cmpVals[0] || empty, c2: cmpVals[1] || empty,\n      minRatio: minF ? this.ratio(minF.raw.fcr) : '', minName: minF ? minF.name : '', maxRatio: maxF ? this.ratio(maxF.raw.fcr) : '', maxName: maxF ? maxF.name : '', minTimes: minF ? r2(minF.raw.fcr).toFixed(2) : '', maxTimes: maxF ? r2(maxF.raw.fcr).toFixed(2) : '',\n      bars, benchLeft: (100 / scaleMax).toFixed(2) + '%', benchRight: (100 - 100 / scaleMax).toFixed(2) + '%',\n      options: (this.sorted || []).map(f => ({ id: f.id, label: f.name + (f.noData ? ' — no matched research data' : f.review ? ' — source values require review' : '') })),\n      rows: (this.sorted || []).map(f => ({ name: f.name, vpr: f.ok ? usd(f.raw.appraised_property_value_per_resident) : '—', ratio: f.ok ? this.ratio(f.raw.fcr) : '—', pop: f.ok ? num(f.raw.population) : '—', res: f.ok ? pctShare(f.raw.pct_residential) : '—',\n        note: f.noData ? 'No matched research data' : f.review ? 'Source values require review' : f.raw.study_tax_haven ? 'Above 3×, the study\\u2019s \\u201cmunicipal tax haven\\u201d threshold' : f.raw.study_fiscally_impoverished ? 'Below one-third, the study\\u2019s \\u201cfiscally impoverished\\u201d threshold' : '' })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
